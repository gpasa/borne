<?xml version="1.0"?>
<!--
  Touches de Borne pour un clavier Mac, chargées par -ctrlr borne_mac.
  Le bouton 1 de MAME est Ctrl gauche par défaut, mais Ctrl+flèche est un
  raccourci de macOS (Mission Control, bureaux) : on joue donc sur Z X C V B N.
  Les réglages faits dans MAME (menu Tab) restent prioritaires.
-->
<mameconfig version="10">
    <system name="default">
        <input>
            <port type="P1_BUTTON1"><newseq type="standard">KEYCODE_Z</newseq></port>
            <port type="P1_BUTTON2"><newseq type="standard">KEYCODE_X</newseq></port>
            <port type="P1_BUTTON3"><newseq type="standard">KEYCODE_C</newseq></port>
            <port type="P1_BUTTON4"><newseq type="standard">KEYCODE_V</newseq></port>
            <port type="P1_BUTTON5"><newseq type="standard">KEYCODE_B</newseq></port>
            <port type="P1_BUTTON6"><newseq type="standard">KEYCODE_N</newseq></port>
        </input>
    </system>
</mameconfig>
